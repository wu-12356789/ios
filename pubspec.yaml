version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lunar: 1.7.8
  shared_preferences: ^2.5.3
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.0
